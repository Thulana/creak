<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>creak</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f6fdb; --ok: #1f8a4c; --warn: #b26a00; --bad: #b3261e; --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --line: #33332f;
      --accent: #6d9cf0; --ok: #4cc27f; --warn: #e0a040; --bad: #ef6b62; --chip: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
  nav button.on { color: var(--text); background: var(--chip); }
  .badge { background: var(--accent); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 12px; margin-left: 4px; }
  main { max-width: 920px; margin: 0 auto; padding: 16px; }
  .hint { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .question { font-size: 22px; font-weight: 600; margin: 2px 0 6px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chip { background: var(--chip); border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 2px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button.act { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.act kbd { opacity: .7; font-size: 11px; margin-left: 4px; }
  input[type=text], select { font: inherit; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .status { font-size: 12px; padding: 1px 7px; border-radius: 9px; background: var(--chip); }
  .status.match, .status.confirmed { color: var(--ok); }
  .status.pending { color: var(--warn); }
  .status.corrected { color: var(--accent); }
  .status.ignored { color: var(--muted); }
  .play { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; flex: none; }
  .play:disabled { opacity: .35; cursor: default; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tune { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px; display: grid; gap: 10px; }
  .tune label { display: grid; grid-template-columns: 150px 1fr 120px; align-items: center; gap: 10px; font-size: 14px; }
  .tune input[type=range] { width: 100%; accent-color: var(--accent); }
  .tune output { font-variant-numeric: tabular-nums; text-align: right; }
  @media (max-width: 640px) { .tune label { grid-template-columns: 1fr 90px; } .tune label input { grid-column: 1 / -1; grid-row: 2; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  canvas { width: 100%; height: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: block; }
  .rec { color: var(--bad); font-weight: 600; }
  .err { background: var(--panel); border: 1px solid var(--bad); color: var(--bad); padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .wide-only { }
  @media (max-width: 640px) { .wide-only { display: none; } header { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <h1>creak</h1>
  <nav>
    <button data-view="review">Review<span class="badge" id="pending-badge" hidden></span></button>
    <button data-view="events">Events</button>
    <button data-view="live">Live</button>
  </nav>
</header>
<main>
  <div class="err" id="error" hidden></div>

  <section id="view-review" hidden>
    <p class="hint">Space play · Y confirm · C correct · I ignore · J/K next/previous</p>
    <div id="review-list"></div>
  </section>

  <section id="view-events" hidden>
    <div class="filters">
      <select id="f-status">
        <option value="active">all but ignored</option>
        <option value="">all statuses</option>
        <option>match</option><option>pending</option><option>confirmed</option><option>corrected</option><option>ignored</option>
      </select>
      <select id="f-label"><option value="">all labels</option></select>
    </div>
    <table>
      <thead><tr><th></th><th>When</th><th>Status</th><th>Label</th><th class="wide-only">Nearest</th><th class="wide-only">Model</th><th class="wide-only">Length</th><th class="wide-only">Peak / ambient</th><th></th></tr></thead>
      <tbody id="events-body"></tbody>
    </table>
    <p><button class="act" id="more">Load more</button></p>
  </section>

  <section id="view-live" hidden>
    <div class="err" id="live-error" hidden></div>
    <div class="stats">
      <div class="stat"><b id="l-level">–</b><span>level dBFS</span></div>
      <div class="stat"><b id="l-ambient">–</b><span id="l-ambient-note">ambient dBFS</span></div>
      <div class="stat"><b id="l-open">–</b><span>opens above</span></div>
      <div class="stat"><b id="l-state">–</b><span id="l-device">device</span></div>
    </div>
    <canvas id="meter"></canvas>
    <p class="hint">Last 30 s of 20 ms frame levels. Dashed: ambient; solid: open line (ambient × ratio); dotted: close line.</p>
    <div class="tune">
      <label>Open ratio <input type="range" id="t-ratio" min="1.2" max="20" step="0.1"><output id="o-ratio"></output></label>
      <label>Close ratio <input type="range" id="t-close" min="1" max="10" step="0.1"><output id="o-close"></output></label>
      <label>Ambient floor <input type="range" id="t-floor" min="-90" max="-20" step="1"><output id="o-floor"></output></label>
      <div class="row"><span class="hint" id="t-source"></span><button class="act" id="t-reset" hidden>Reset to config file</button></div>
    </div>
  </section>
</main>
<datalist id="known-labels"></datalist>
<audio id="player" preload="none"></audio>

<script>
const params = new URLSearchParams(location.search);
let token = params.get('token') || '';
try {
  if (token) localStorage.setItem('creak-token', token);
  else token = localStorage.getItem('creak-token') || '';
} catch (_) {}
if (params.has('token')) history.replaceState(null, '', location.pathname + location.hash);

const $ = (id) => document.getElementById(id);
const player = $('player');
const withToken = (url) => token ? url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token) : url;

async function api(path, options) {
  const res = await fetch(withToken(path), options);
  if (res.status === 401) {
    showError('This page needs the access token. Open the link that `creak setup` printed (it ends in ?token=…).');
    throw new Error('unauthorized');
  }
  if (!res.ok) { const msg = await res.text(); showError(msg); throw new Error(msg); }
  $('error').hidden = true;
  return res.json();
}
function showError(msg) { $('error').textContent = msg; $('error').hidden = false; }

const fmtTime = (ts) => new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtDuration = (e) => {
  const s = Math.round(e.duration_ms / 100) / 10;
  const text = s < 60 ? s.toFixed(1) + ' s' : Math.floor(s / 60) + ' min ' + Math.round(s % 60) + ' s';
  return e.parts > 1 ? `${text} · ${e.parts} clips` : text;
};
const fmtDb = (v) => v == null ? '–' : v.toFixed(1);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;

let playingId = null;
function play(id, button) {
  if (playingId === id && !player.paused) { player.pause(); return; }
  document.querySelectorAll('.play').forEach((b) => b.textContent = '▶');
  player.src = withToken('/api/clips/' + id + '.wav');
  player.play().catch((e) => showError('Could not play the clip: ' + e.message));
  playingId = id;
  if (button) button.textContent = '■';
}
player.addEventListener('ended', () => document.querySelectorAll('.play').forEach((b) => b.textContent = '▶'));
player.addEventListener('pause', () => document.querySelectorAll('.play').forEach((b) => b.textContent = '▶'));

async function setLabel(id, label) {
  const res = await api('/api/events/' + id + '/label', { method: 'POST', body: JSON.stringify({ label }) });
  refreshLabels();
  return res.event;
}

// ---- labels and pending count
let knownLabels = [];
async function refreshLabels() {
  const { labels, pending } = await api('/api/labels');
  knownLabels = labels.map((l) => l.label);
  $('known-labels').innerHTML = knownLabels.map((l) => `<option value="${esc(l)}">`).join('');
  const sel = $('f-label'), current = sel.value;
  sel.innerHTML = '<option value="">all labels</option>' + knownLabels.map((l) => `<option>${esc(l)}</option>`).join('');
  sel.value = current;
  $('pending-badge').textContent = pending;
  $('pending-badge').hidden = pending === 0;
}

// ---- review
let queue = [], cursor = 0;
async function loadReview() {
  const { events } = await api('/api/events?status=pending&limit=200');
  queue = events;
  cursor = Math.min(cursor, Math.max(queue.length - 1, 0));
  renderReview();
}
function renderReview() {
  const list = $('review-list');
  if (!queue.length) { list.innerHTML = '<div class="card"><b>Nothing to review.</b><p class="hint">New sounds appear here as they are heard. The Live view shows whether the microphone is picking anything up.</p></div>'; return; }
  list.innerHTML = queue.map((e, i) => `
    <div class="card ${i === cursor ? 'current' : ''}" data-i="${i}">
      <div class="row">
        <button class="play" data-play="${e.id}" ${e.clip_path ? '' : 'disabled'}>▶</button>
        <span class="hint">#${e.id} · ${fmtTime(e.ts)} · ${fmtDuration(e)} · peak ${fmtDb(e.peak_db)} dB over ${fmtDb(e.ambient_db)}</span>
      </div>
      <div class="question">${esc(cap(e.label))}?</div>
      <div class="row" style="margin-bottom:10px">
        ${(e.top_classes || []).map(([name, score]) => `<button class="chip" data-pick="${esc(name)}">${esc(name)} ${(score * 100).toFixed(0)}%</button>`).join('')}
        ${e.nearest_label ? `<span class="hint">nearest: ${esc(e.nearest_label)} ${e.similarity.toFixed(2)}</span>` : ''}
      </div>
      <div class="row">
        <button class="act primary" data-confirm>Confirm<kbd>Y</kbd></button>
        <input type="text" list="known-labels" placeholder="or type a label" data-input>
        <button class="act" data-correct>Correct<kbd>C</kbd></button>
        <button class="act" data-ignore>Ignore<kbd>I</kbd></button>
      </div>
    </div>`).join('');
}
async function answer(i, label) {
  const e = queue[i];
  if (!label) return;
  await setLabel(e.id, label);
  queue.splice(i, 1);
  cursor = Math.min(i, Math.max(queue.length - 1, 0));
  renderReview();
}
$('review-list').addEventListener('click', (ev) => {
  const card = ev.target.closest('.card[data-i]');
  if (!card) return;
  const i = Number(card.dataset.i), e = queue[i];
  const input = card.querySelector('[data-input]');
  if (cursor !== i && !ev.target.closest('input')) { cursor = i; card.parentElement.querySelectorAll('.card').forEach((c) => c.classList.toggle('current', c === card)); }
  if (ev.target.closest('[data-play]')) play(e.id, ev.target.closest('[data-play]'));
  else if (ev.target.closest('[data-pick]')) { input.value = ev.target.closest('[data-pick]').dataset.pick.toLowerCase(); input.focus(); }
  else if (ev.target.closest('[data-confirm]')) answer(i, e.label);
  else if (ev.target.closest('[data-correct]')) input.value.trim() ? answer(i, input.value) : input.focus();
  else if (ev.target.closest('[data-ignore]')) answer(i, 'ignore');
});
$('review-list').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.matches('[data-input]')) {
    const i = Number(ev.target.closest('.card').dataset.i);
    answer(i, ev.target.value);
  }
  if (ev.key === 'Escape') ev.target.blur();
});
document.addEventListener('keydown', (ev) => {
  if (view !== 'review' || ev.target.matches('input, select, textarea') || ev.metaKey || ev.ctrlKey || !queue.length) return;
  const card = document.querySelector(`.card[data-i="${cursor}"]`);
  const e = queue[cursor];
  const move = (d) => { cursor = Math.max(0, Math.min(queue.length - 1, cursor + d)); renderReview(); document.querySelector('.card.current')?.scrollIntoView({ block: 'nearest' }); };
  switch (ev.key.toLowerCase()) {
    case ' ': ev.preventDefault(); if (e.clip_path) play(e.id, card.querySelector('[data-play]')); break;
    case 'y': answer(cursor, e.label); break;
    case 'c': ev.preventDefault(); card.querySelector('[data-input]').focus(); break;
    case 'i': answer(cursor, 'ignore'); break;
    case 'j': move(1); break;
    case 'k': move(-1); break;
  }
});

// ---- events
let lastId = null;
async function loadEvents(append) {
  const q = new URLSearchParams({ limit: 50 });
  const status = $('f-status').value;
  if (status === 'active') q.set('hide_ignored', '1');
  else if (status) q.set('status', status);
  if ($('f-label').value) q.set('label', $('f-label').value);
  if (append && lastId) q.set('before', lastId);
  const { events } = await api('/api/events?' + q);
  const rows = events.map((e) => `
    <tr data-id="${e.id}">
      <td><button class="play" data-play="${e.id}" ${e.clip_path ? '' : 'disabled'}>▶</button></td>
      <td>${fmtTime(e.ts)}</td>
      <td><span class="status ${e.status}">${e.status}</span></td>
      <td>${esc(e.label)}${e.exemplar ? ' ★' : ''}</td>
      <td class="wide-only">${e.nearest_label ? esc(e.nearest_label) + ' ' + e.similarity.toFixed(2) : '–'}</td>
      <td class="wide-only">${esc(e.top_classes?.[0]?.[0] ?? '')}</td>
      <td class="wide-only">${fmtDuration(e)}</td>
      <td class="wide-only">${fmtDb(e.peak_db)} / ${fmtDb(e.ambient_db)}</td>
      <td><button class="act" data-relabel>Relabel</button></td>
    </tr>`).join('');
  if (append) $('events-body').insertAdjacentHTML('beforeend', rows); else $('events-body').innerHTML = rows;
  if (events.length) lastId = events[events.length - 1].id;
  $('more').hidden = events.length < 50;
}
$('events-body').addEventListener('click', async (ev) => {
  const row = ev.target.closest('tr[data-id]');
  if (!row) return;
  const id = Number(row.dataset.id);
  if (ev.target.closest('[data-play]')) play(id, ev.target.closest('[data-play]'));
  if (ev.target.closest('[data-relabel]')) {
    const label = prompt('Label for event #' + id + ' (or "ignore")' + (knownLabels.length ? '\nKnown: ' + knownLabels.join(', ') : ''));
    if (label && label.trim()) { await setLabel(id, label); loadEvents(false); }
  }
});
$('f-status').addEventListener('change', () => loadEvents(false));
$('f-label').addEventListener('change', () => loadEvents(false));
$('more').addEventListener('click', () => loadEvents(true));

// ---- live
let liveFrame = 0, levels = [], live = null, liveTimer = null;
async function pollLive() {
  try {
    live = await api('/api/live?since=' + liveFrame);
    if (live.frame < liveFrame) levels = [];
    levels.push(...live.levels);
    levels = levels.slice(-1500);
    liveFrame = live.frame;
    const last = levels[levels.length - 1];
    $('l-level').textContent = fmtDb(last);
    $('l-ambient').textContent = fmtDb(live.ambient_db);
    const measured = live.measured_ambient_db;
    $('l-ambient-note').textContent = measured != null && measured < live.ambient_db
      ? `ambient dBFS · floor; room measures ${fmtDb(measured)}` : 'ambient dBFS';
    showTuning(live);
    $('l-open').textContent = fmtDb(live.open_db);
    $('l-state').innerHTML = live.error ? '<span class="rec">no audio</span>' : live.recording ? '<span class="rec">● recording</span>' : 'listening';
    $('live-error').hidden = !live.error;
    $('live-error').textContent = live.error ? 'Microphone problem (retrying every 10 s): ' + live.error : '';
    $('l-device').textContent = live.device ? `${live.device} @ ${live.device_rate} Hz` : 'no audio yet';
    draw();
  } catch (_) {}
}
// Sliders follow the daemon's values unless one is being dragged.
let dragging = false;
const dbOver = (ratio) => '+' + (20 * Math.log10(ratio)).toFixed(1) + ' dB';
function showTuning(live, force) {
  const t = live.tuning;
  if (!t || (dragging && !force)) return;
  $('t-ratio').value = t.ratio; $('t-close').value = t.close_ratio; $('t-floor').value = t.ambient_floor_db;
  updateOutputs();
  $('t-source').textContent = live.tuned ? 'Set here; overrides the config file.' : 'From the config file.';
  $('t-reset').hidden = !live.tuned;
}
function updateOutputs() {
  const r = Number($('t-ratio').value), c = Number($('t-close').value);
  $('o-ratio').textContent = `× ${r.toFixed(1)} (${dbOver(r)})`;
  $('o-close').textContent = `× ${c.toFixed(1)} (${dbOver(c)})`;
  $('o-floor').textContent = `${$('t-floor').value} dBFS`;
}
async function sendTuning() {
  const ratio = Number($('t-ratio').value);
  const close_ratio = Math.min(Number($('t-close').value), ratio - 0.1);
  const body = { ratio, close_ratio, ambient_floor_db: Number($('t-floor').value) };
  try { showTuning(Object.assign(live || {}, await api('/api/trigger', { method: 'POST', body: JSON.stringify(body) })), true); } catch (_) {}
}
for (const id of ['t-ratio', 't-close', 't-floor']) {
  const el = $(id);
  el.addEventListener('input', () => { dragging = true; updateOutputs(); });
  el.addEventListener('change', async () => { await sendTuning(); dragging = false; });
}
$('t-reset').addEventListener('click', async () => {
  try { showTuning(Object.assign(live || {}, await api('/api/trigger', { method: 'DELETE' })), true); } catch (_) {}
});

function draw() {
  const c = $('meter'), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const color = (v) => css.getPropertyValue(v).trim();
  const lo = -100, hi = 0, y = (db) => h - (Math.max(lo, Math.min(hi, db)) - lo) / (hi - lo) * h;
  g.font = '11px system-ui'; g.fillStyle = color('--muted'); g.strokeStyle = color('--line'); g.lineWidth = 1;
  for (let db = -80; db <= -20; db += 20) { g.beginPath(); g.moveTo(0, y(db)); g.lineTo(w, y(db)); g.stroke(); g.fillText(db + ' dB', 4, y(db) - 3); }
  g.strokeStyle = color('--accent'); g.lineWidth = 1.5; g.beginPath();
  const n = 1500, step = w / n, offset = n - levels.length;
  levels.forEach((v, i) => { const x = (offset + i) * step; i ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); });
  g.stroke();
  if (!live) return;
  const line = (db, dash, col) => { g.setLineDash(dash); g.strokeStyle = color(col); g.beginPath(); g.moveTo(0, y(db)); g.lineTo(w, y(db)); g.stroke(); };
  line(live.ambient_db, [6, 4], '--muted');
  line(live.open_db, [], '--bad');
  line(live.close_db, [2, 3], '--warn');
  g.setLineDash([]);
}

// ---- navigation
let view = null;
function show(name) {
  view = name;
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
  document.querySelectorAll('main > section').forEach((s) => s.hidden = s.id !== 'view-' + name);
  clearInterval(liveTimer);
  if (name === 'review') loadReview();
  if (name === 'events') loadEvents(false);
  if (name === 'live') { pollLive(); liveTimer = setInterval(pollLive, 250); }
  try { localStorage.setItem('creak-view', name); } catch (_) {}
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => show(b.dataset.view)));
let startView = 'review';
try { startView = localStorage.getItem('creak-view') || 'review'; } catch (_) {}
refreshLabels().catch(() => {});
show(startView);
setInterval(() => { refreshLabels().catch(() => {}); if (view === 'review' && !document.activeElement.matches('input')) loadReview().catch(() => {}); }, 15000);
</script>
</body>
</html>
